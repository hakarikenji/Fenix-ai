name: Fenix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Identity guard tests
        working-directory: api
        run: python test_identity_guard.py

      - name: World-class layer tests (db, memory, ratings)
        working-directory: api
        run: python test_world_class.py

      - name: Import server (catches wiring errors)
        run: python -c "import sys; sys.path.insert(0, 'api'); import server; print('server import OK')"

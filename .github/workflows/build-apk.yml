name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No AI key here: the APK talks to the Fenix server, which holds
      # GEMINI_API_KEY in its own environment. Users never configure anything.
      # The server URL comes from a repo VARIABLE named FENIX_SERVER (Settings →
      # Secrets and variables → Actions → Variables) and wins over web/config.js.
      - name: Inject server URL for the APK
        run: |
          if [ -n "${{ vars.FENIX_SERVER }}" ]; then
            printf 'window.FENIX_SERVER = "%s";\n' "${{ vars.FENIX_SERVER }}" > web/config.js
            echo "Injected FENIX_SERVER from repo variable"
          else
            echo "No FENIX_SERVER variable set — using web/config.js as committed"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      # The WebView opens assets/public/index.html, but that file is the
      # compatibility copy of the legacy UI the server serves at /legacy. The
      # current UI is index_new.html, so without this the APK ships the old
      # screen: no Music, no Video, no builder. Copy it over after sync,
      # because sync copies web/ verbatim and would undo an earlier rename.
      - name: Point the WebView at the current UI
        run: |
          if [ -f web/index_new.html ]; then
            cp web/index_new.html android/app/src/main/assets/public/index.html
            echo "index.html now serves the current UI ($(wc -c < web/index_new.html) bytes)"
          else
            echo "no index_new.html — leaving the legacy index.html in place"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Ubuntu runners تأتي مع Android SDK مثبتاً مسبقاً (ANDROID_HOME جاهز)

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FenixAI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
